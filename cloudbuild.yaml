substitutions:
  _REGION: asia-northeast3
  _SERVICE: minutemark
  _REPOSITORY: cloud-run-source-deploy

steps:
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >-
        docker pull
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest"
        || true

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - .

  - id: test
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --volume
      - /workspace/tests:/tests:ro
      - --entrypoint
      - python
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - -m
      - unittest
      - discover
      - -s
      - /tests
      - -v

  - id: push-commit
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --port=8080
      - --cpu=2
      - --memory=4Gi
      - --concurrency=1
      - --min=0
      - --max=1
      - --max-instances=1
      - --timeout=180
      - --update-env-vars=APP_COMMIT_SHA=$COMMIT_SHA
      - --update-labels=git-commit=$SHORT_SHA,managed-by=cloud-build
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
