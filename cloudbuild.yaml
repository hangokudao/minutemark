substitutions:
  _REGION: asia-northeast3
  _SERVICE: minutemark
  _REPOSITORY: cloud-run-source-deploy

steps:
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >-
        docker pull
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest"
        || true

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - .

  - id: build-test
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - sample-tools
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - --tag
      - ${_SERVICE}:test-$COMMIT_SHA
      - .

  - id: test
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --volume
      - /workspace/tests:/tests:ro
      - --volume
      - /workspace/samples:/samples:ro
      - --entrypoint
      - python
      - ${_SERVICE}:test-$COMMIT_SHA
      - -m
      - unittest
      - discover
      - -s
      - /tests
      - -v

  - id: push-commit
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --port=8080
      - --cpu=2
      - --memory=4Gi
      - --concurrency=1
      - --min=0
      - --max=1
      - --max-instances=1
      - --timeout=180
      - --service-account=minutemark-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --no-traffic
      - --tag=v2-$SHORT_SHA
      - --update-env-vars=APP_COMMIT_SHA=$COMMIT_SHA,A6_API_BASE=https://api.a6api.com/v1,A6_MODEL=gpt-5.6-luna,A6_VENDOR_ID=1729,A6_INPUT_USD_PER_M=0.005256,A6_OUTPUT_USD_PER_M=0.0315,A6_RUN_BUDGET_USD=1.0,A6_REQUEST_RESERVE_USD=0.01,A6_REQUEST_TIMEOUT_SECONDS=60,MAX_AUDIO_DURATION_SECONDS=120,MAX_ANALYSES_PER_INSTANCE=50,BUDGET_PERSISTENCE=ephemeral,MEMBER_FEATURES_ENABLED=true,PERSISTENT_SAMPLE_CACHE_ENABLED=true,MAX_TOTAL_AUDIO_BYTES=536870912,FIREBASE_PROJECT_ID=$PROJECT_ID,MEETING_AUDIO_BUCKET=$PROJECT_ID-meetings,RUNTIME_SERVICE_ACCOUNT=minutemark-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --update-secrets=A6_API_KEY=minutemark-a6-api-key:1
      - --update-labels=git-commit=$SHORT_SHA,managed-by=cloud-build
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
